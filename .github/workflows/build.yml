name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  LLAMA_REF: b11669        # pinned llama.cpp tag; falls back to master if the tag does not exist
  NDK_VERSION: 27.3.13750724   # default only; the llama.cpp lib's own ndkVersion wins if it has one
  CMAKE_VERSION: 3.31.6        # default only; the lib's own cmake version wins if it has one
  APK_NAME: Vethos-debug.apk

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Works if the repo root IS the project, or the project is inside one
      # sub-folder (e.g. Vethos/), or you uploaded Vethos.zip.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Vethos.zip && ! -f settings.gradle.kts ]]; then
            unzip -q -o Vethos.zip
          fi
          S=$(find . -maxdepth 2 -name settings.gradle.kts -not -path '*/llama.cpp/*' | head -n1 || true)
          if [[ -z "$S" ]]; then
            echo "::error::settings.gradle.kts not found. Put the Vethos project (or Vethos.zip) in the repo."
            exit 1
          fi
          D=$(dirname "$S")
          test -f "$D/app/build.gradle.kts"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          echo "Project: $D"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/llama.cpp"      # settings.gradle.kts expects it here
          rm -rf "$DEST"
          if git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git "$DEST"; then
            echo "Fetched llama.cpp ref: $LLAMA_REF"
          else
            rm -rf "$DEST"
            echo "::warning::LLAMA_REF '$LLAMA_REF' not found; using master"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$DEST"
          fi
          git -C "$DEST" log -1 --oneline
          test -f "$DEST/examples/llama.android/lib/build.gradle.kts" || {
            echo "::error::This llama.cpp ref has no examples/llama.android/lib module. Set LLAMA_REF to a newer tag or master."
            exit 1
          }

      - name: Prepare llama.cpp Android lib
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path(os.environ['PROJECT_DIR']) / 'llama.cpp/examples/llama.android/lib/build.gradle.kts'
          s = p.read_text()
          # upstream uses a version catalog; swap it for plain ids/coordinates
          s = s.replace('alias(libs.plugins.android.library)', 'id("com.android.library")')
          s = re.sub(r'alias\(libs\.plugins\.(?:jetbrains\.)?kotlin\.android\)', 'id("org.jetbrains.kotlin.android")', s)
          s = s.replace('libs.androidx.core.ktx', '"androidx.core:core-ktx:1.13.1"')
          s = s.replace('libs.androidx.datastore.preferences', '"androidx.datastore:datastore-preferences:1.1.1"')
          s = re.sub(r'^\s*(?:test|androidTest)Implementation\(libs\.[^\n]*\n', '', s, flags=re.M)
          s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', s)
          s = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 29', s)   # Android 10+
          s = re.sub(r'abiFilters\s*\+=\s*listOf\([^)]*\)', 'abiFilters += listOf("arm64-v8a")', s)
          left = sorted(set(re.findall(r'libs\.[\w.]+', s)))
          if left:
              raise SystemExit('::error::unresolved version-catalog refs in lib/build.gradle.kts: ' + ', '.join(left))
          p.write_text(s)
          ndk = re.search(r'ndkVersion\s*=\s*"([^"]+)"', s)
          cm = re.search(r'(?<![A-Za-z])version\s*=\s*"(\d+\.\d+[\d.]*)"', s)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              if ndk: f.write('NDK_VERSION=' + ndk.group(1) + '\n')
              if cm: f.write('CMAKE_VERSION=' + cm.group(1) + '\n')
          print('lib patched. ndk =', ndk.group(1) if ndk else 'default', '| cmake =', cm.group(1) if cm else 'default')
          PY

      - name: Install Android SDK parts
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" >/dev/null
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION"
          echo "ndk.dir ok: $NDK_VERSION, cmake ok: $CMAKE_VERSION"

      # The icon, adaptive/monochrome icon and splash screen live inside the
      # project (res/ + themes.xml). Fail early if anything is missing.
      - name: Check icon and splash resources
        shell: bash
        run: |
          set -euo pipefail
          RES="$PROJECT_DIR/app/src/main/res"
          M="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          for f in mipmap-anydpi-v26/ic_launcher.xml mipmap-anydpi-v26/ic_launcher_round.xml drawable/ic_launcher_fg.xml values/colors.xml values/themes.xml; do
            test -s "$RES/$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q 'android:icon="@mipmap/ic_launcher"' "$M"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$M"
          grep -q 'Theme.Vethos.Starting' "$RES/values/themes.xml"
          grep -q 'windowSplashScreenAnimatedIcon' "$RES/values/themes.xml"
          grep -q 'Theme.Vethos.Starting' "$M"
          grep -q 'windowSplashScreenBackground' "$RES/values/themes.xml"
          grep -q '<monochrome' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          echo "Icon + splash resources OK"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|sdkVersion|native-code|launchable-activity|application-icon|application-label" badging.txt || true
          grep -q "sdkVersion:'29'" badging.txt || { echo "::error::APK minSdk is not 29 (Android 10 will refuse to install it)"; exit 1; }
          grep -q "launchable-activity" badging.txt || { echo "::error::no launcher activity in APK"; exit 1; }
          grep -q "application-icon.*ic_launcher" badging.txt || { echo "::error::launcher icon missing in APK"; exit 1; }
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' | head -20
          unzip -l "$APK" | grep -qE 'lib/arm64-v8a/.*\.so' || { echo "::error::no native arm64 libraries in APK"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          split -b 3M -d -a 2 "$APK_NAME" "$APK_NAME.part"
          sha256sum "$APK_NAME".part* > parts.sha256
          zip -q -9 Vethos-debug.zip "$APK_NAME"
          zip -T Vethos-debug.zip

      - name: Create Termux download helper
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat > get-vethos.sh <<'SCRIPT'
          #!/bin/sh
          BASE="https://github.com/@REPO@/releases/download/@TAG@"
          APK="@APK@"
          fetch() {
            n=0
            until wget -c -T 30 -q --show-progress "$BASE/$1"; do
              n=$((n+1)); [ "$n" -ge 30 ] && return 1
              echo "retry $n ..."; sleep 3
            done
          }
          fetch "$APK.sha256" || { echo "hash file nahi mili"; exit 1; }
          i=0
          while [ "$i" -lt 5 ]; do
            fetch "$APK" && sha256sum -c "$APK.sha256" && { echo "OK: $APK verified"; exit 0; }
            rm -f "$APK"; i=$((i+1))
          done
          echo "Tukdon se download kar raha hoon ..."
          rm -f parts.sha256
          fetch parts.sha256 || exit 1
          while read -r h f; do
            n=0
            until [ -f "$f" ] && echo "$h  $f" | sha256sum -c - >/dev/null 2>&1; do
              rm -f "$f"; n=$((n+1)); [ "$n" -gt 15 ] && exit 1
              fetch "$f" </dev/null || exit 1
            done
          done < parts.sha256
          cat "$APK".part* > "$APK"
          sha256sum -c "$APK.sha256"
          SCRIPT
          # YAML already removed the block indent; nothing else to strip
          sed -i "s|@REPO@|${GITHUB_REPOSITORY}|; s|@TAG@|vethos-build-${GITHUB_RUN_NUMBER}|; s|@APK@|${APK_NAME}|" get-vethos.sh
          chmod +x get-vethos.sh
          sh -n get-vethos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vethos-debug
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vethos-build-${{ github.run_number }}
          name: Vethos debug build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/Vethos-debug.apk
            dist/Vethos-debug.apk.sha256
            dist/Vethos-debug.zip
            dist/Vethos-debug.apk.part*
            dist/parts.sha256
            dist/get-vethos.sh

      - name: Verify release download checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="vethos-build-${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4 5; do
            rm -rf check && mkdir check
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p "$APK_NAME" -p "$APK_NAME.sha256" -D check \
              && (cd check && sha256sum -c "$APK_NAME.sha256"); then
              echo "Release round-trip checksum OK"; exit 0
            fi
            sleep 5
          done
          echo "::error::Release APK checksum verification failed"
          exit 1

      - name: Job summary
        shell: bash
        run: |
          TAG="vethos-build-${GITHUB_RUN_NUMBER}"
          HASH=$(cut -d' ' -f1 "dist/$APK_NAME.sha256")
          {
            echo '## Vethos APK ready'
            echo
            echo "SHA256: $HASH"
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo 'Termux:'
            echo '```sh'
            echo 'pkg install wget -y'
            echo "wget https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/get-vethos.sh"
            echo 'sh get-vethos.sh'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            grep -nE 'error:|e: |FAILED|What went wrong|CMake Error|undefined reference|fatal error' build.log | head -60 || true
            tail -40 build.log
          fi
