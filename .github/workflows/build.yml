name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  LLAMA_REF: b11669
  NDK_VERSION: 27.3.13750724
  APK_NAME: Vethos-debug.apk

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Supports either a repository containing this project directly, a
      # vethos-native/ subfolder, or the original vethos-native-source.zip.
      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f vethos-native-source.zip ]]; then
            unzip -q -o vethos-native-source.zip
          fi
          if [[ -f vethos-native/app/build.gradle.kts ]]; then
            echo "PROJECT_DIR=vethos-native" >> "$GITHUB_ENV"
          elif [[ -f app/build.gradle.kts ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::Could not find app/build.gradle.kts or vethos-native-source.zip"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK parts
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${NDK_VERSION}" >/dev/null
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ANDROID_HOME/cmake/3.22.1"

      - name: Fetch llama.cpp (pinned ref)
        shell: bash
        run: |
          set -euo pipefail
          DEST="$PROJECT_DIR/app/src/main/cpp/llama.cpp"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          if git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git "$DEST"; then
            echo "Fetched llama.cpp ref: $LLAMA_REF"
          else
            rm -rf "$DEST"
            echo "::warning::LLAMA_REF '$LLAMA_REF' was not found as a branch/tag; falling back to master"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$DEST"
          fi
          git -C "$DEST" log -1 --oneline

      - name: Configure Android native build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path(os.environ['PROJECT_DIR']) / 'app/build.gradle.kts'
          s = p.read_text()
          s = re.sub(r'abiFilters\s*\+=\s*listOf\([^)]*\)', 'abiFilters += listOf("arm64-v8a")', s)
          if 'ndkVersion' not in s:
              s = s.replace('compileSdk = 35', 'compileSdk = 35\n    ndkVersion = "' + os.environ['NDK_VERSION'] + '"')
          p.write_text(s)
          PY
          cat > "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.22.1)
          project(vethos_llama LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          if(NOT EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/llama.cpp/CMakeLists.txt")
            message(FATAL_ERROR "llama.cpp missing")
          endif()
          set(BUILD_SHARED_LIBS ON CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_SERVER OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(LLAMA_BUILD_COMMON OFF CACHE BOOL "" FORCE)
          set(LLAMA_CURL OFF CACHE BOOL "" FORCE)
          set(LLAMA_OPENSSL OFF CACHE BOOL "" FORCE)
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_OPENMP OFF CACHE BOOL "" FORCE)
          set(GGML_LLAMAFILE OFF CACHE BOOL "" FORCE)
          add_subdirectory(llama.cpp)
          add_library(vethos_llama SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(vethos_llama PRIVATE llama ${log-lib} android)
          target_compile_options(vethos_llama PRIVATE -O3)
          CMAKE
          sed -i 's/^          //' "$PROJECT_DIR/app/src/main/cpp/CMakeLists.txt"

      - name: Verify app icon and splash resources
        shell: bash
        run: |
          set -euo pipefail
          RES="$PROJECT_DIR/app/src/main/res"
          for f in \
            "$RES/drawable/vethos_icon_fg.xml" \
            "$RES/drawable/vethos_launch_bg.xml" \
            "$RES/values/vethos_icon_colors.xml" \
            "$RES/values/vethos_launch_theme.xml" \
            "$RES/values-v31/vethos_launch_theme.xml" \
            "$RES/mipmap-anydpi-v26/vethos_icon.xml" \
            "$RES/mipmap-anydpi-v26/vethos_icon_round.xml"; do
            test -s "$f" || { echo "::error::Missing Android branding resource: $f"; exit 1; }
          done
          grep -q 'android:icon="@mipmap/vethos_icon"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:theme="@style/Theme.Vethos.Launch"' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK and prepare downloads
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E '^package:|sdkVersion|native-code'
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          split -b 3M -d -a 2 "$APK_NAME" "$APK_NAME.part"
          sha256sum "$APK_NAME".part* > parts.sha256
          zip -q -9 Vethos-debug.zip "$APK_NAME"
          zip -T Vethos-debug.zip

      - name: Create Termux download helper
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat > get-vethos.sh <<'SCRIPT'
          #!/bin/sh
          BASE="https://github.com/@REPO@/releases/download/@TAG@"
          APK="@APK@"
          fetch() {
            n=0
            until wget -c -T 30 -q --show-progress "$BASE/$1"; do
              n=$((n+1)); [ "$n" -ge 30 ] && return 1
              echo "retry $n ..."; sleep 3
            done
          }
          fetch "$APK.sha256" || { echo "hash file nahi mili"; exit 1; }
          i=0
          while [ "$i" -lt 5 ]; do
            fetch "$APK" && sha256sum -c "$APK.sha256" && { echo "OK: $APK verified"; exit 0; }
            rm -f "$APK"; i=$((i+1))
          done
          echo "Tukdon se download kar raha hoon ..."
          rm -f parts.sha256
          fetch parts.sha256 || exit 1
          while read -r h f; do
            n=0
            until [ -f "$f" ] && echo "$h  $f" | sha256sum -c - >/dev/null 2>&1; do
              rm -f "$f"; n=$((n+1)); [ "$n" -gt 15 ] && exit 1
              fetch "$f" || exit 1
            done
          done < parts.sha256
          cat "$APK".part* > "$APK"
          sha256sum -c "$APK.sha256"
          SCRIPT
          sed -i 's/^          //' get-vethos.sh
          sed -i "s|@REPO@|${GITHUB_REPOSITORY}|; s|@TAG@|vethos-build-${GITHUB_RUN_NUMBER}|; s|@APK@|${APK_NAME}|" get-vethos.sh
          chmod +x get-vethos.sh
          sh -n get-vethos.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vethos-debug
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vethos-build-${{ github.run_number }}
          name: Vethos debug build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/Vethos-debug.apk
            dist/Vethos-debug.apk.sha256
            dist/Vethos-debug.zip
            dist/Vethos-debug.apk.part*
            dist/parts.sha256
            dist/get-vethos.sh

      - name: Verify release download checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="vethos-build-${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4 5; do
            rm -rf check && mkdir check
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p "$APK_NAME" -p "$APK_NAME.sha256" -D check \
              && (cd check && sha256sum -c "$APK_NAME.sha256"); then
              echo "Release round-trip checksum OK"; exit 0
            fi
            sleep 5
          done
          echo "::error::Release APK checksum verification failed"
          exit 1

      - name: Job summary
        shell: bash
        run: |
          TAG="vethos-build-${GITHUB_RUN_NUMBER}"
          HASH=$(cut -d' ' -f1 "dist/$APK_NAME.sha256")
          {
            echo '## Vethos APK ready'
            echo
            echo "SHA256: \\`$HASH\\`"
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo 'Termux:'
            echo '```sh'
            echo 'pkg install wget -y'
            echo "wget https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/get-vethos.sh"
            echo 'sh get-vethos.sh'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            grep -nE 'error:|e: |FAILED|What went wrong|CMake Error|undefined reference|fatal error' build.log | head -60 || true
            tail -40 build.log
          fi
